# Weekly check against the latest yt-dlp and FFmpeg (the `tools_*` tests in
# src/live_tests.rs): yt-dlp must still accept the app's download arguments
# and produce the expected files, using a short video generated locally.
#
# The checks that need the real YouTube (`live_*`) don't run here: YouTube
# asks CI runners to prove they aren't bots. Run them by hand when needed.
#
# When a scheduled or manual run fails, an issue is opened (or updated) so the
# breakage doesn't go unnoticed.
name: Upstream check

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays, 09:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/upstream.yml
      - src/live_tests.rs
      - src/args.rs

permissions:
  contents: read
  issues: write

jobs:
  tools:
    name: Latest yt-dlp and FFmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install the latest yt-dlp and FFmpeg
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile (Join-Path $bin 'yt-dlp.exe')
          Add-Content $env:GITHUB_PATH $bin
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
              choco install ffmpeg -y --no-progress
          }

      - name: Tool versions
        shell: pwsh
        run: |
          yt-dlp --version
          ffmpeg -version | Select-Object -First 1

      - name: Tool tests
        run: cargo test --release --locked tools_ -- --ignored --nocapture

      - name: Open or update an issue
        if: failure() && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create upstream-check --color B60205 --description "Weekly yt-dlp/YouTube check failed" --force
          $existing = gh issue list --label upstream-check --state open --json number --jq '.[0].number'
          $body = "The weekly check against the latest yt-dlp and FFmpeg failed: $env:RUN_URL`n`nyt-dlp may have changed in a way that affects the app's download arguments. See the test output in the run."
          if ($existing) {
              gh issue comment $existing --body $body
          } else {
              gh issue create --title "Upstream check failed (yt-dlp changed?)" --label upstream-check --body $body
          }
