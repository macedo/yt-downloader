# Checks every pull request and every push to main: formatting, lints,
# tests and a release build, plus a dependency audit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Security advisories (RustSec), dependency licenses, banned crates and
      # allowed sources (see deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@v2
