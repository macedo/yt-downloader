# Releases a new version when it lands on main: if the version in Cargo.toml
# has no vX.Y.Z tag yet, test, build the installer and publish a GitHub
# Release (which creates the tag) with the changelog (commits since the
# previous tag), the installer and its checksum.
#
# So releasing is just merging a PR that bumps the version in Cargo.toml.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never run two releases at once; queue them instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Compare Cargo.toml with the existing tags
        run: |
          version=$(grep -m1 -E '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag yet; releasing it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    env:
      TAG: v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, to build the changelog since the previous tag.
          fetch-depth: 0

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release --locked

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1

      - name: Compute SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
              "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Generate changelog
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
        run: |
          # Local tag only, so the changelog script can find the range since
          # the previous tag; the Release step creates the real tag.
          git tag $env:TAG $env:GITHUB_SHA
          ./installer/changelog.ps1 -Tag $env:TAG -Repo $env:REPO | Set-Content dist/RELEASE_NOTES.md -Encoding utf8
          Get-Content dist/RELEASE_NOTES.md

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
