# On a vX.Y.Z tag push: test, build the installer and publish a GitHub Release
# with the changelog (commits since the previous tag), the installer and its
# checksum.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, to build the changelog since the previous tag.
          fetch-depth: 0

      - name: Check that the tag matches the Cargo.toml version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:TAG -ne "v$cargo") {
              Write-Error "Tag $env:TAG does not match the Cargo.toml version ($cargo). Update Cargo.toml and create tag v$cargo."
              exit 1
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1

      - name: Compute SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
              "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Generate changelog
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ./installer/changelog.ps1 -Tag $env:TAG -Repo $env:REPO | Set-Content dist/RELEASE_NOTES.md -Encoding utf8
          Get-Content dist/RELEASE_NOTES.md

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
