# Weekly pull requests to keep dependencies and GitHub Actions up to date.
# CI runs on each of them, so a breaking update shows up as a failed check.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One PR for all minor/patch updates; major updates (e.g. a new egui
    # version, which usually changes its API) each get their own PR.
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
