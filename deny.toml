# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
# The app only ships for Windows, so crates that are only pulled in for other
# platforms (e.g. winit's Linux/Wayland and macOS backends) are not checked.
targets = ["x86_64-pc-windows-msvc", "x86_64-pc-windows-gnu"]

[bans]
# GUI stacks routinely depend on several versions of the same crate (bitflags,
# windows-sys…); that is not actionable here, so don't report it.
multiple-versions = "allow"

[licenses]
# Licenses allowed for dependencies: all permissive and compatible with the
# app's MIT license and with shipping it as a binary installer. self_cell is
# "Apache-2.0 OR GPL-2.0-only" and is used under Apache-2.0.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla's CA certificate list)
    "ISC",
    "MIT",
    "MPL-2.0",             # option-ext
    "OFL-1.1",             # egui's default fonts
    "Ubuntu-font-1.0",     # egui's default fonts
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
