[package]
name = "yt-downloader"
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/macedo/yt-downloader"

[dependencies]
dirs = "7.0.0"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"
winreg = "0.56.0"

[profile.release]
strip = true
opt-level = 3

